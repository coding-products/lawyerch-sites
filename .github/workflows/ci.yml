name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all sites
        run: pnpm build

      - name: Script unit tests
        run: python3 -m unittest discover -s scripts/tests

      - name: Content compliance
        run: python3 scripts/check-content --all

      - name: Links and canonical
        run: |
          for site in $(python3 scripts/list-sites); do
            [ -d "$site/dist" ] || continue
            echo "::group::$site"
            python3 scripts/check-links "$site"
            echo "::endgroup::"
          done

      - name: Design check
        run: |
          if [ ! -x scripts/design-check ]; then
            echo "::error::缺少 scripts/design-check，在工作区运行 ./scripts/sync-standard 重新分发"
            exit 1
          fi
          for site in $(python3 scripts/list-sites); do
            [ -d "$site/dist" ] && ./scripts/design-check "$site"
          done
